<h1>Angular Built-in Pipes</h1>

<h3>UpperCase</h3>
<p>{{ name | uppercase }}</p>

<h3>LowerCase</h3>
<p>{{ name | lowercase }}</p>

<h3>TitleCase</h3>
<p>{{ name | titlecase }}</p>

<h3>Currency</h3>
<p>{{ price | currency }}</p>

<h3>Date</h3>
<p>{{ today | date }}</p>

<h3>Percent</h3>
<p>{{ percentage | percent }}</p>

<h3>Slice</h3>
<p>{{ name | slice:0:7 }}</p>

<h3>JSON</h3>

<pre>{{ student | json }}</pre>
